## IDF Component Manager Manifest File
dependencies:
  waveshare/esp_lcd_sh8601: 1.0.2
  espressif/esp_lcd_co5300: ^2.0.3
  # Pinned to versions that predate the esp_lcd_panel_dev_config_t field rename
  # (rgb_endian/color_space -> rgb_ele_order), so they no longer compile on
  # ESP-IDF 6. Each has a 2.x release that follows the rename, but ili9341 is
  # esp-box-3's panel and the other two belong to boards not on this desk, so
  # bumping them is a change that cannot be verified here. korvo-1 drives a
  # raw RGB panel and needs none of them: keep them off this target until the
  # affected boards can be tested against 2.x.
  espressif/esp_lcd_ili9341:
    version: "==1.2.0"
    rules:
    - if: "target not in [esp32s31]"
  espressif/esp_lcd_gc9a01:
    version: "==2.0.1"
    rules:
    - if: "target not in [esp32s31]"
  espressif/esp_lcd_st77916: ^1.0.1
  espressif/esp_lcd_axs15231b:
    version: "^1.0.0"
    rules:
    - if: "target not in [esp32s31]"

  espressif/esp_lcd_st7701:
    version: ^1.1.4
    rules:
    - if: target in [esp32s3, esp32p4]
  espressif/esp_lcd_st7796:
    version: 1.3.5
    rules:
    - if: target in [esp32, esp32s2, esp32s3, esp32p4]
  espressif/esp_lcd_spd2010: ==1.0.2
  # 2.0.0 includes driver/i2c_master.h without requiring esp_driver_i2c, which
  # only worked while that header came from the monolithic driver component.
  # ESP-IDF 6 split it out and 2.0.0 stopped compiling; 2.0.3 declares it.
  espressif/esp_io_expander_tca9554: ^2.0.3
  # Board hardware this target has no board for, and which does not compile on
  # ESP-IDF 6 (driver/i2c_master.h moved into esp_driver_i2c; the esp_lcd panel
  # config fields were renamed). korvo-1 drives a raw RGB panel with a GT1151,
  # so none of it is reachable here.
  waveshare/custom_io_expander_ch32v003:
    version: "^1.0.0"
    rules:
    - if: "target not in [esp32s31]"
  espressif/esp_lcd_panel_io_additions: ^1.0.1
  78/esp_lcd_nv3023:
    version: "~1.0.0"
    rules:
    - if: "target not in [esp32s31]"
  78/esp-wifi-connect: ~3.1.3
  # Aligned with LiveKit SDK transitive deps (av_render 1.0.x).
  espressif/esp_audio_effects: ~1.3
  espressif/esp_audio_codec: ~2.5
  78/esp-ml307: ~3.6.5
  78/uart-eth-modem:
    version: ~0.4.0
    rules:
    - if: target not in [esp32]
  78/xiaozhi-fonts: ~1.6.0
  espressif/led_strip: ~3.0.2
  # LiveKit SDK (av_render 1.0.x) requires esp_codec_dev ~1.5.
  espressif/esp_codec_dev: ~1.5
  # LiveKit esp_capture 0.8.x requires esp-sr ^2.4. Stay on 2.4.x: it already
  # ships esp32s31 libraries, and 2.5.0 is where esp-sr took a dependency on
  # esp-dl. The AFE unconditionally references wakenet, which then drags
  # esp-dl into the link — ~0.93 MB of flash for a model this firmware never
  # runs (wake word is disabled, NS/VAD are the WebRTC variants).
  espressif/esp-sr: ~2.4
  espressif/button: ~4.1.5
  espressif/knob: ^1.0.0
  esphome/esp-hub75:
    version: ^0.3.5
    rules:
    - if: target in [esp32p4, esp32s3]
  espressif/esp32-camera:
    version: ^2.1.6
    rules:
    - if: target in [esp32s3]
  espressif/esp_video:
    version: ^2.1      # esp_capture 0.8.x requires esp_video ^2.1
    rules:
    - if: target in [esp32p4, esp32s3]
  
  espressif/esp_image_effects:
    version: ^1.0.1
    rules:
    - if: target not in [esp32]
  espressif/esp_lcd_touch_ft5x06: ~1
  espressif/esp_lcd_touch_gt911: ^1
  espressif/esp_lcd_touch_tt21100:
    version: ^1.2.0~1
    rules:
    - if: target in [esp32s3]
  espressif/esp_lcd_touch_gt1151: ^1
  waveshare/esp_lcd_touch_cst9217: ^1.0.3
  espressif/esp_lcd_touch_cst816s:
    version: "^1"
    rules:
    - if: "target not in [esp32s31]"
  lvgl/lvgl: ~9.5.0
  # 2.7.x guards the whole RGB path behind CONFIG_IDF_TARGET_ESP32S3, so on any
  # other RGB-capable target no vsync/bounce callback is registered and the
  # first flush blocks forever on trans_sem — a hang, not an error. 2.9.0
  # dropped that guard and checks only the IDF version.
  esp_lvgl_port: ~2.9.0
  espressif/esp_io_expander_tca95xx_16bit: ^2.0.0
  espressif2022/image_player: ^1.1.1
  # 1.0.x is the first line on esp_emote_gfx 3.x, i.e. on esp_new_jpeg 1.x.
  espressif2022/esp_emote_expression: ^1.0
  espressif/esp_mmap_assets: ^1.3.2
  txp666/otto-emoji-gif-component:
    version: ^1.1.1
    rules:
    - if: target in [esp32s3]
  espressif/adc_battery_estimation: ^0.2.1
  # esp_video_codec (pulled by av_render 1.0) needs esp_new_jpeg 1.x, and
  # esp_emote_gfx 2.x pinned 0.6.* — which is why the emote stack moves too.
  espressif/esp_new_jpeg: ^1.0
  espressif/mdns: "^1.4.0"
  # Replaces the in-tree wifi_provisioning component, which ESP-IDF 6 removed.
  # Builds on IDF 5 as well, so this is the single provisioning path for the
  # whole board matrix rather than a target-conditional one.
  espressif/network_provisioning: "^1.2"

  # Our fork of livekit/client-sdk-esp32, pinned to a commit: managed_components/
  # is not tracked, so the fork is the only place a fix to this SDK survives.
  # It is upstream v0.3.10 (the newest release) plus two fixes, both of which
  # this firmware depends on:
  #   - the engine releases a subscribed audio track when it goes away, so a
  #     connection can carry more than one conversation;
  #   - a data channel is only started on a connection that negotiates one, so
  #     the subscriber can reach connected instead of retrying SCTP INIT forever.
  # https over ssh so a build needs no SSH access to the fork.
  livekit/livekit:
    git: https://github.com/eidolon-os/client-sdk-esp32.git
    path: components/livekit
    version: 312ce4742b35f92e47915a161d271f7ef027ce5a
    rules:
    - if: target in [esp32s3, esp32p4, esp32s31]

  espressif/esp-tflite-micro: "^1.3.0"

  espressif/human_face_detect:
    version: "*"
    rules:
    - if: target in [esp32s3]
  espressif/human_face_recognition:
    version: "*"
    rules:
    - if: target in [esp32s3]

  # SenseCAP Watcher Board
  wvirgil123/sscma_client:
    version: 1.0.2
    rules:
    - if: target in [esp32s3]

  tny-robotics/sh1106-esp-idf:
    version: "^1.0.0"
    rules:
    - if: "target not in [esp32s31]"
  espressif/esp_lcd_jd9365:
    version: '*'
    rules:
    - if: target in [esp32p4]
  waveshare/esp_lcd_hx8394:
    version: '*'
    rules:
    - if: target in [esp32p4]
  waveshare/esp_lcd_st7703:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espressif/esp32_p4_function_ev_board:
    version: ^5.0.3
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ili9881c:
    version: ^1.0.1
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ek79007:
    version: ^1.0.3
    rules:
    - if: target in [esp32p4]
  espressif/esp_hosted:
    version: 2.0.17
    rules:
    - if: target in [esp32h2, esp32p4]
  espressif/esp_wifi_remote:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espfriends/servo_dog_ctrl:
    version: ^0.1.8
    rules:
    - if: target in [esp32c3]

  llgok/cpp_bus_driver:
    version: 1.1.0
    rules:
    - if: target in [esp32p4]

  espressif/bmi270_sensor:
    version: ^0.1.0
    rules:
    - if: target in [esp32s3, esp32c5]

  espressif/touch_slider_sensor:
    version: ^0.2.0~1
    rules:
    - if: target in [esp32s3]

  espressif/touch_button_sensor:
    version: ^0.2.2~1
    rules:
    - if: target in [esp32s3]

  espressif/esp_lcd_touch_st7123: ^1.0.0
  espressif/iot_usbh_rndis: 
    version: ^0.3.1
    rules:
    - if: target in [esp32s3, esp32p4]

  espressif/bq27220:
    public: true
    version: '*'

  ## Required IDF version
  idf:
    version: '>=5.5.2'
  m5stack/m5ioe1:
    version: "^1.0.8"
    rules:
    - if: "target not in [esp32s31]"
  m5stack/m5pm1:
    version: "^1.0.5"
    rules:
    - if: "target not in [esp32s31]"
